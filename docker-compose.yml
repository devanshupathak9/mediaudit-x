# MediAudit-X local stack: backend (FastAPI) + frontend (Next.js), using the
# Elasticsearch configured in backend/.env (ELASTIC_URL, or
# ELASTIC_CLOUD_ID + ELASTIC_API_KEY). No Elasticsearch container is started.
#
#   docker compose up --build     first run
#   docker compose up             later runs
#   docker compose down           stop
#
# UI http://localhost:3000 · API docs http://localhost:8000/docs
#
# If backend/.env points at an Elasticsearch running on your Mac itself,
# use ELASTIC_URL=http://host.docker.internal:9200 (not localhost, which
# inside a container means the container).
#
# Missing indices are created automatically (setup step and API startup).
# Sample data is loaded only if the insurance-claims index is empty; set
# SEED_SAMPLE_DATA=false in backend/.env to never load it.
#
# backend/app and frontend/app are mounted into the containers and both
# servers hot-reload, so code edits show up without rebuilding. Rebuild
# (--build) after changing requirements.txt, package.json or config files.
# Ports: override with BACKEND_PORT / FRONTEND_PORT if taken.

name: mediaudit-x

services:
  setup:
    build: ./backend
    command: ["sh", "./docker-setup.sh"]
    env_file: ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      # Loaders resolve data/ four levels above their file, i.e. /data here.
      - ./data:/data

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
      - uploads:/app/uploads
    depends_on:
      setup:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      # The browser calls the API directly, so this is the URL as seen from
      # the browser. Point the UI at a remote backend with API_BASE_URL, e.g.
      #   API_BASE_URL=http://187.77.130.9:8000 docker compose up -d --no-deps frontend
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}}
      WATCHPACK_POLLING: "true"  # file-change detection through Docker Desktop mounts
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/app:/app/app
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
